name: Weekly Package Updates

on:
  schedule:
    # Run every Monday at 03:00 UTC (11:00 CST)
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  update-pkgs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Update custom packages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          nix shell nixpkgs#just --command just update

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-update-pkgs
          title: "chore(pkgs): weekly automated package updates"
          body: |
            Automated weekly update of packages in `pkgs/` using `nix-update`.
          commit-message: "chore(pkgs): weekly automated package updates"
          delete-branch: true

      - name: Notify ntfy
        if: always()
        run: |
          TOKEN="${{ secrets.NTFY_TOKEN }}"
          AUTH_HEADER=()
          if [ -n "$TOKEN" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer $TOKEN")
          fi
          if [ "${{ job.status }}" != "success" ]; then
            curl -s "${AUTH_HEADER[@]}" \
              -H "Title: Weekly Updates Failed" \
              -H "Priority: high" \
              -H "Tags: x" \
              -d "island: automated weekly package updates failed" \
              https://ntfy.s4r.in/ci || true
          elif [ "${{ steps.cpr.outputs.pull-request-number }}" != "" ]; then
            curl -s "${AUTH_HEADER[@]}" \
              -H "Title: Weekly Updates PR Created" \
              -H "Tags: package" \
              -d "island: package update PR #${{ steps.cpr.outputs.pull-request-number }} created" \
              https://ntfy.s4r.in/ci || true
          fi
