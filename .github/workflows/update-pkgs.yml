name: Weekly Package Updates

on:
  schedule:
    # Run every Monday at 03:00 UTC (11:00 CST)
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  update-pkgs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Update custom packages
        run: |
          set -euo pipefail
          export GIT_EDITOR=true

          update_one() {
            local pkg="$1"
            echo "::group::Updating $pkg"
            if nix shell nixpkgs#nix-update --command nix-update --flake --commit "$pkg" 2>/dev/null \
              || nix shell nixpkgs#nix-update --command nix-update --flake --commit --version=branch "$pkg" 2>/dev/null; then
              echo "Successfully processed $pkg"
            else
              echo "Warning: nix-update failed for $pkg, skipping."
            fi
            echo "::endgroup::"
          }

          for p in pkgs/*.nix pkgs/*/package.nix pkgs/*/default.nix; do
            [ -f "$p" ] || continue
            grep -qE "fetchFrom|fetchgit|fetchurl" "$p" || continue
            pkg="$(basename "$p" .nix)"
            [ "$pkg" = "package" ] || [ "$pkg" = "default" ] && pkg="$(basename "$(dirname "$p")")"
            update_one "$pkg"
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-update-pkgs
          title: "chore(pkgs): weekly automated package updates"
          body: |
            Automated weekly update of packages in `pkgs/` using `nix-update`.
          commit-message: "chore(pkgs): weekly automated package updates"
          delete-branch: true
