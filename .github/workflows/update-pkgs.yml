name: Weekly Package Updates

on:
  schedule:
    # Run every Monday at 03:00 UTC (11:00 CST)
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  update-pkgs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Update custom packages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          nix shell nixpkgs#just --command just update-pkgs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-update-pkgs
          title: "chore(pkgs): weekly automated package updates"
          body: |
            Automated weekly update of packages in `pkgs/` using `nix-update`.
          commit-message: "chore(pkgs): weekly automated package updates"
          delete-branch: true
