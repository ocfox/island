name: "CI & Binary Cache"

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-experimental-features = pipe-operators

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: oc
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build system toplevels
        run: |
          nix build .#nixosConfigurations.{gallery,kumo,light}.config.system.build.toplevel --no-link

      - name: Notify ntfy
        if: always()
        run: |
          STATUS="${{ job.status }}"
          TOKEN="${{ secrets.NTFY_TOKEN }}"
          AUTH_HEADER=()
          if [ -n "$TOKEN" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer $TOKEN")
          fi
          if [ "$STATUS" = "success" ]; then
            curl -s "${AUTH_HEADER[@]}" \
              -H "Title: Island CI Succeeded" \
              -H "Tags: white_check_mark" \
              -d "CI build and Cachix push succeeded on master" \
              https://ntfy.s4r.in/ci || true
          else
            curl -s "${AUTH_HEADER[@]}" \
              -H "Title: Island CI Failed" \
              -H "Priority: high" \
              -H "Tags: x" \
              -d "CI build failed on master (${{ github.sha }})" \
              https://ntfy.s4r.in/ci || true
          fi
